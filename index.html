<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CSV / Sheets → Job Poster JSON</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-100 min-h-screen">

  <div class="max-w-7xl mx-auto p-4">
    <h1 class="text-3xl font-bold mb-2 text-slate-800">Job Poster Generator</h1>
    <p class="text-slate-600 mb-6">
      Upload CSV or paste Google Sheets link. Preview or copy JSON per job.
    </p>

    <!-- Inputs -->
    <div class="flex flex-col md:flex-row gap-4 mb-6">
      <input type="file" id="csvFile" accept=".csv"
        class="block w-full md:w-1/2 text-sm text-slate-500
        file:mr-4 file:py-2 file:px-4
        file:rounded-lg file:border-0
        file:text-sm file:font-semibold
        file:bg-blue-600 file:text-white
        hover:file:bg-blue-700" />

      <div class="flex w-full md:w-1/2 gap-2">
        <input type="text" id="sheetLink" placeholder="Paste public Google Sheets link..."
          class="flex-1 p-2 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500" />
        <button id="loadSheet"
          class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700">
          Load
        </button>
      </div>
    </div>

    <!-- Status -->
    <div id="statusMsg" class="mb-4 text-sm text-slate-600"></div>

    <!-- Cards Grid -->
    <div id="cards" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
  </div>

  <!-- Preview Modal -->
  <div id="modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl max-w-3xl w-full p-4">
      <div class="flex justify-between items-center mb-2">
        <h2 class="text-lg font-bold text-slate-800">JSON Prompt Preview</h2>
        <button id="closeModal" class="text-slate-500 hover:text-slate-800">✕</button>
      </div>
      <pre id="modalContent" class="bg-slate-100 p-3 rounded-lg text-xs overflow-auto max-h-[70vh]"></pre>
    </div>
  </div>

  <script>
    const fileInput = document.getElementById("csvFile");
    const sheetInput = document.getElementById("sheetLink");
    const loadSheetBtn = document.getElementById("loadSheet");
    const cardsContainer = document.getElementById("cards");
    const statusMsg = document.getElementById("statusMsg");

    const modal = document.getElementById("modal");
    const modalContent = document.getElementById("modalContent");
    const closeModal = document.getElementById("closeModal");

    // Restore remembered sheet link
    const savedSheet = localStorage.getItem("lastSheetLink");
    if (savedSheet) {
      sheetInput.value = savedSheet;
    }

    closeModal.addEventListener("click", () => {
      modal.classList.add("hidden");
    });

    fileInput.addEventListener("change", () => {
      const file = fileInput.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => processCSV(e.target.result);
      reader.readAsText(file);
    });

    loadSheetBtn.addEventListener("click", async () => {
      const link = sheetInput.value.trim();
      if (!link) return alert("Paste a Google Sheets link");

      localStorage.setItem("lastSheetLink", link); // remember it

      const csvUrl = convertSheetLinkToCSV(link);
      if (!csvUrl) return alert("Invalid Google Sheets link");

      statusMsg.textContent = "Loading sheet...";
      try {
        const res = await fetch(csvUrl);
        const text = await res.text();
        processCSV(text);
        statusMsg.textContent = "Sheet loaded successfully.";
      } catch (e) {
        console.error(e);
        alert("Failed to load sheet. Make sure it's public.");
      }
    });

    function convertSheetLinkToCSV(link) {
      const match = link.match(/spreadsheets\/d\/([^\/]+)/);
      if (!match) return null;
      const id = match[1];
      return `https://docs.google.com/spreadsheets/d/${id}/export?format=csv`;
    }

    function processCSV(csvText) {
      const lines = csvText.split(/\r?\n/).filter(l => l.trim() !== "");
      if (lines.length < 2) {
        alert("CSV must have headers and at least one row");
        return;
      }

      const headers = parseCSVLine(lines[0]);
      const idx = name => headers.findIndex(h => h.trim().toLowerCase() === name.toLowerCase());

      const iJobID = idx("Job ID");
      const iJD = idx("JD");
      const iDes = idx("Designation Name");
      const iExp = idx("Experience if required");
      const iStatus = idx("status");
      const iLoc = idx("Location");

      cardsContainer.innerHTML = "";
      let count = 0;

      for (let i = 1; i < lines.length; i++) {
        const row = parseCSVLine(lines[i]);
        if (!row.length) continue;

        const jobID = (row[iJobID] || "").trim();
        const status = (row[iStatus] || "").toLowerCase().trim();
        const exp = (row[iExp] || "").trim();
        const loc = (row[iLoc] || "").trim();

        // ✅ Exclusion rules
        if (status === "posted") continue;
        if (!jobID) continue;
        if (!exp) continue;

        const jd = row[iJD] || "";
        const des = row[iDes] || "";

        const jsonTemplate = {
          "poster_type": "Job Recruitment Poster",
          "prompt": `Modern corporate job recruitment poster for a ${des}. Clean, minimal UI layout with a light blue and white gradient background. Rounded card-based composition, professional startup aesthetic. Headline text: “WE ARE HIRING”Subheading: “${des}” Include a photorealistic South Asian Indian young professional (male or female) working in a modern office environment. Soft office lighting, shallow depth of field, blurred background with subtle blue/white overlay for text readability.`,
          "negative_prompt": "Messy layout, clutter, low resolution, distorted text, poor typography, watermark, logo misuse, oversaturated colors, blur, artifacts, stock-photo look, uncanny faces.",
          "Image_to_include": `Photorealistic original image young professional ${des} South Asian Indian IT Proffessional or Proffessional working in related industry (choose random gender male or female ) Model (consider the age based on the ${des} identify the which post the poster is being designed for like is it Senior or Junior, keep the highest age slab as 40 years and lowest age slab 20 years while creating the model persona ) working in an office environment`,
          "style": "modern corporate UI, marketing poster",
          "anti_halucination_instruction": "Critically evaluate this information and list any potential inaccuracies or contradictions. Do not use external knowledge or fabricate any information.",
          "job_details": {
            "Job_ID": jobID,
            "JD": jd,
            "Designation_Name": des,
            "Experience": exp,
            "Location": loc
          },
          
          "design_inpiration_attachment": {
            "instruction": "If a design inspiration image is included, use it only as a visual style reference for layout, spacing, hierarchy, typography, color treatment, mood, component styling, and overall design language. Do not copy or recreate the reference exactly. Preserve the overall design inspiration while generating a fresh original composition using only the information provided in job_details.",
            "fallback": "If no design inspiration image is provided, automatically create a premium modern corporate recruitment poster that matches the job designation, experience level, and industry.",
            "image_handling": {
              "reference_priority": "Use the uploaded reference only for visual styling.",
              "ignore_reference_content": true,
              "ignore_reference_text": true,
              "ignore_reference_logo": true,
              "ignore_reference_branding": true,
              "ignore_reference_job_information": true,
              "generate_new_layout": true,
              "maintain_original_creativity": true
            }
          },
          "brand_logo": {
          "source": {
            "uploaded_logo": "Use the uploaded company's light theme logo image if provided.",
            "logo_url": "https://www.itjobcell.com/assets/website/img/logo.png",
            "fallback": "Use the default company logo only if neither an uploaded logo nor logo_url is available."
          },
          "priority_order": [
            "uploaded_logo",
            "logo_url",
            "fallback"
          ],
          "placement": "Top-left corner",
          "background": {
            "style": "Solid corporate blue matching the poster theme with a subtle gradient.",
            "padding": "20-28px equal padding on all four sides.",
            "border_radius": "18-24px rounded rectangle.",
            "shadow": "Soft subtle shadow with low opacity."
          },
          "logo_fit": {
            "preserve_aspect_ratio": true,
            "safe_margin": "Keep 12-16px internal whitespace around the logo.",
            "max_width": "220px",
            "max_height": "70px",
            "do_not_crop": true,
            "do_not_stretch": true
          },
          "appearance": {
            "keep_original_colors": true,
            "do_not_recolor": true,
            "do_not_modify_logo": true,
            "do_not_replace_fonts": true,
            "maintain_transparency": true,
            "preserve_original_resolution": true
          },
          "integration": {
            "blend_with_design": "Place the logo inside a premium rounded brand card that matches the poster UI theme.",
            "align_with_content_grid": true,
            "maintain_consistent_top_and_left_margin": true
          }
        },
          "logo_integration_instruction": "If a company logo is supplied as either an uploaded image or a logo_url, always use that logo exactly as provided. Never recreate, redraw, vectorize, recolor, sharpen, regenerate, or modify the logo. Preserve its original aspect ratio, colors, transparency, typography, proportions, and resolution. The priority order is: uploaded_logo → logo_url → fallback logo. Place the logo inside a premium rounded rectangular brand container using the primary theme blue background with generous equal padding (20-28px), soft rounded corners (18-24px radius), and a subtle shadow. Ensure the logo is perfectly centered within the container with consistent whitespace around every edge. Do not allow the logo to touch the container edges. Maintain equal spacing from the top and left margins of the poster. The logo container should appear as a native UI component rather than a pasted image.",
          "logo_constraints": {
          "never_touch_edges": true,
          "always_use_equal_padding": true,
          "preserve_transparency": true,
          "preserve_original_resolution": true,
          "never_add_outline": true,
          "never_apply_glow": true,
          "never_change_brand_colors": true,
          "never_overlap_text": true,
          "never_place_over_busy_background": true,
          "maintain_visual_balance": true
        },
          "Technnology_icons_to_include": `include proportionate equal height matching dimension ${des} original technology  icon logo especially equally spaced and well alligned relative to the content in whitespace area use tiny original technology icon logo only if clearly identifiable and shown in original brand colors. Skip if uncertain avoid using over faces ,body of models, very close-by text contents etc. when using along with content follow the allignment of the content`,
          "lighting": "soft office lighting",
          "composition": "premium white space, sharp focus, high detail.",
          "aspect_ratio": "1:1, resolution 1080×1080, 4K quality look",
          "Resolution": "1080 x 1080",
          "reality_check": "This will look corporate and credible, not like a spam hiring poster If you want it to feel premium startup instead of IT consultancy, reduce text density even more and let the face + whitespace do the work. Dont include any external data that is not included in this prompt. If the Jd is not real please write a very short jd that matches the actual designation. Make sure its simple single sentence",
          "design_style": {
            "theme_colors": ["blue", "white"],
            "look_and_feel": "modern tech startup, flat + semi-realistic UI, Canva/Photoshop-quality marketing poster.",
            "typography": "clean sans-serif, strong hierarchy, corporate and readable",
            "background": {
              "image_source": `Create a best background matching ${des} job poster`,
              "effect": "Blurred",
              "overlay": "Soft white/blue gradient for text readability"
            }
          },
          "layout_structure": {
            "top_section": "Job title highlighted with bold typography in Capital case",
            "middle_section": "Properly aligned Job details displayed in a clean card or grid format and avoid excess spacing. Arrange all keys left alligned and values just after the : with equal spaced from the key in  in Sentence case",
            "bottom_section": "Contact details aligned neatly with icons",
            "White_space_area": `Show the ${exp} needed`,
            "allignment_standard_to_follow":"if the content is is column layout dont use center align onlu use center align only if the content is columns"
          },
          "footer_details": {
            "Website": "https://www.itjobcell.com/",
            "Email": "careers@itjobcell.com",
            "Phone": "+91 9526011800"
          },
          "visual_elements": {
            "icons": ["website", "email", "phone"],
            "shapes": "Soft rounded rectangles or lines",
            "spacing": "Balanced white space for premium appearance"
          },
          "constraints": {
            "no_repeated_information": true,
            "single_occurrence_of_contact_details": true
          }
        };


        const jsonString = JSON.stringify(jsonTemplate, null, 2);

        const finalString = 'Create Image ' + jsonString;

        const card = document.createElement("div");
        card.className = "bg-white rounded-xl shadow hover:shadow-lg transition p-4 border border-slate-200 flex flex-col";

        card.innerHTML = `
          <div class="text-xs text-slate-500 mb-1">Job ID</div>
          <div class="font-semibold text-slate-800 mb-2">${jobID}</div>

          <div class="text-lg font-bold text-blue-700 mb-1">${des}</div>
          <div class="text-sm text-slate-600 mb-2 line-clamp-3">${jd}</div>

          <div class="text-sm text-slate-700 mb-4">
            <span class="font-semibold">Experience:</span> ${exp}
          </div>

          <div class="mt-auto flex gap-2">
            <button class="previewBtn flex-1 px-3 py-2 text-sm bg-slate-200 rounded-lg hover:bg-slate-300">
              Preview Prompt
            </button>
            <button class="copyBtn flex-1 px-3 py-2 text-sm bg-blue-600 text-white rounded-lg hover:bg-blue-700">
              Copy JSON
            </button>
          </div>
        `;

        const previewBtn = card.querySelector(".previewBtn");
        const copyBtn = card.querySelector(".copyBtn");

        previewBtn.addEventListener("click", () => {
          modalContent.textContent = finalString;
          modal.classList.remove("hidden");
          modal.classList.add("flex");
        });

        copyBtn.addEventListener("click", async () => {
          await navigator.clipboard.writeText(finalString);
          const originalText = copyBtn.textContent;
          copyBtn.textContent = "Copied ✓";
          copyBtn.classList.remove("bg-blue-600");
          copyBtn.classList.add("bg-green-600");
          setTimeout(() => {
            copyBtn.textContent = originalText;
            copyBtn.classList.remove("bg-green-600");
            copyBtn.classList.add("bg-blue-600");
          }, 1200);
        });

        cardsContainer.appendChild(card);
        count++;
      }

      statusMsg.textContent = `Loaded ${count} job(s) (excluding posted, missing Job ID, or missing Experience).`;
    }

    function parseCSVLine(line) {
      const result = [];
      let current = "";
      let inQuotes = false;

      for (let i = 0; i < line.length; i++) {
        const char = line[i];
        if (char === '"') {
          inQuotes = !inQuotes;
        } else if (char === "," && !inQuotes) {
          result.push(current.trim());
          current = "";
        } else {
          current += char;
        }
      }
      result.push(current.trim());
      return result.map(v => v.replace(/^"|"$/g, ""));
    }
  </script>

</body>
</html>
